# The lock takes the newest of each input once a week, in the window every
# one of my flakes shares: Sunday 21:23 UTC, two hours before nix-config
# takes its own. So a kernel or library fix reaches every repository within
# the week, and they all land on the same nixos-unstable revision -- one
# nixpkgs closure rather than several, already in the danielbodart cache
# when nix-config asks for it.
#
# The new lock is checked as docker.yml's nix job checks it, the VM test
# included, before anything is committed: a bump that breaks the build fails
# here and master keeps the lock it had. Only flake.lock is committed, named
# by the inputs that moved.
#
# A push made with GITHUB_TOKEN starts no workflow, so docker.yml would
# neither test nor publish the bumped commit. The last step dispatches it on
# master, which publishes as a push does: a new version (the commit count
# moved), its image on both registries, and its release.
name: Bump flake.lock

on:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# This is the only workflow that writes to master.
concurrency:
  group: flake-lock

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the flake's version has its commit count.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Hosted runners have /dev/kvm, but not readable by the runner's user;
      # without it the VM test falls back to emulation, many times slower.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31

      # Pushes what it builds only once CACHIX_AUTH_TOKEN is set; without
      # it the cache is read-only.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update every input
        id: update
        run: |
          nix flake update 2>&1 | tee update.log
          if git diff --quiet flake.lock; then
            echo "Nothing moved."
          else
            moved=$(grep -oE "Updated input '[^']+'" update.log | cut -d"'" -f2 | paste -sd, - | sed 's/,/, /g')
            echo "moved=${moved:-flake.lock}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the flake with the new lock, as docker.yml does
        if: steps.update.outputs.moved
        run: nix flake check -L

      - name: Commit and push the lock
        if: steps.update.outputs.moved
        env:
          MOVED: ${{ steps.update.outputs.moved }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Bump flake.lock: $MOVED" flake.lock
          git pull -q --rebase origin master
          git push -q origin HEAD:master

      - name: Test and publish the bumped master
        if: steps.update.outputs.moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref master
