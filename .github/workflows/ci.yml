name: CI

# Every push to the default branch is tested in every channel: mise's checks,
# the flake with its NixOS VM test, the image run, and the tarball installed
# under a real systemd. A release - the images and a GitHub release of the
# same version - waits for all of them, and is made only when something it is
# built from (RELEASE_PATHS in mise.toml) changed since the last release tag,
# or a dispatch asks for one with `release`. The weekly update dispatches it
# so.
#
# Replaces the CircleCI pipeline, which failed silently at checkout for two
# years: its deploy key lost repo access, every build died before the Docker
# step, and the published image stayed frozen at June 2024. Actions checks out
# with a built-in token, so there is no external key to rot.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release even if nothing in RELEASE_PATHS changed since the last release
        type: boolean
        default: false

# Least privilege for the built-in token. Read-only by default, and widened
# only on the job that publishes. Without this every job inherits whatever the
# repository default happens to be, which on many repositories is read *and
# write*.
permissions:
  contents: read

# bash, so GitHub runs every step with -eo pipefail: a command that fails on
# the left of a pipe fails the step rather than handing on what it printed.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mise.toml pins Go, for CI and for anyone working on this locally.
      - uses: jdx/mise-action@v5
      - run: mise run check

  # The flake: the package (its build runs the tests), the module evaluation
  # and the NixOS VM test, which boots a router, a host and a client and sends
  # traffic through a forward.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Hosted runners have /dev/kvm, but not readable by the runner's user;
      # without it the VM test falls back to emulation, many times slower.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31

      # Read from the cache, and push only the package below: never the VM
      # test's closure, which would fill the free tier.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Flake check
        run: nix flake check -L

      - name: Push the package to Cachix
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: nix build .#default --print-out-paths | cachix push danielbodart

  # Everything the upstream channel ships, built once, by mise's Go: the
  # images, the tests below and the release all use these bytes.
  dist:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.due.outputs.value }}
    steps:
      # The whole history and its tags: the version's minor is the commit
      # count, which ./run refuses to compute from a shallow clone, and
      # whether to release is a diff from the last release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run dist

      - name: Version
        id: version
        run: echo "value=$(cat dist/version)" >> "$GITHUB_OUTPUT"

      - name: Release?
        id: due
        env:
          FORCE: ${{ inputs.release }}
        run: |
          if [ "$FORCE" = true ] || mise run release-due; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      # Tarred, because an artifact does not keep the binaries' mode.
      - run: tar -cf dist.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist.tar

  # The image for amd64, built from dist/ and run: it must say its version.
  docker:
    runs-on: ubuntu-latest
    needs: dist
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: tar -xf dist.tar
      - uses: docker/setup-buildx-action@v4
      - run: ./run smoke

  # The x86_64 tarball unpacked and installed as the docs say, and its unit
  # checked against a real systemd with the binary where it expects it.
  tarball:
    runs-on: ubuntu-latest
    needs: dist
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: tar -xf dist.tar
      - run: ./run install-check

  release:
    runs-on: ubuntu-latest
    needs: [check, nix, dist, docker, tarball]
    if: >-
      github.event_name != 'pull_request'
      && github.ref_name == github.event.repository.default_branch
      && needs.dist.outputs.release == 'true'
    permissions:
      contents: write
      packages: write
      # cosign's keyless signing: the run's OIDC identity is the signer.
      id-token: write
    env:
      VERSION: ${{ needs.dist.outputs.version }}
    steps:
      # The whole history and its tags, for the notes: the commits since the
      # last release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: tar -xf dist.tar
      - uses: jdx/mise-action@v5

      # Each asset gets a sigstore bundle beside it, as capsper's tarballs do:
      # `cosign verify-blob --bundle <asset>.sigstore.json` proves this
      # workflow, on this repository, built it.
      - name: Sign
        run: |
          for f in dist/release/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # The same image on GitHub's registry, for anyone who would rather not
      # depend on Docker Hub's pull limits. The image's
      # org.opencontainers.image.source label links the package to this
      # repository.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the images
        uses: docker/build-push-action@v7
        with:
          context: .
          # ARM matters more than usual here: Portical runs on the home network
          # it is forwarding ports for, which is very often a Pi or an ARM NAS,
          # and not always a 64-bit one. Each image only copies its binary in,
          # so no architecture is emulated.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # Both tags point at the same image. :latest is what the README and
          # every existing compose file pull; the exact version is what makes
          # it possible to pin one, and to roll back to one.
          tags: |
            danielbodart/portical:latest
            danielbodart/portical:${{ env.VERSION }}
            ghcr.io/danielbodart/portical:latest
            ghcr.io/danielbodart/portical:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}

      # A re-run has the same run number and so the same version, so the
      # release may already exist: its assets are replaced rather than the job
      # failing.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            # The notes are the commits since the last release.
            {
              if prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA" 2>/dev/null); then
                git log "$prev..$GITHUB_SHA" --pretty='- %s (%h)'
              else
                git log -1 --pretty='- %s (%h)' "$GITHUB_SHA"
              fi
              echo
              echo "Image: \`danielbodart/portical:$VERSION\` or \`ghcr.io/danielbodart/portical:$VERSION\`"
            } > notes.md
            gh release create "$tag" dist/release/* --target "$GITHUB_SHA" --title "$tag" --latest --notes-file notes.md
          fi

  # Docker Hub has not synced a README from GitHub since Automated Builds went
  # away, so the page at hub.docker.com stayed empty while this repository's
  # README said everything worth knowing. It has to be pushed over the API.
  #
  # Kept in its own job, and allowed to fail, because it is cosmetic: the image
  # is what a release is, and a description that would not update must not make
  # a perfectly good publish look broken. A failure is still visible here.
  #
  # Editing the repository is a different permission from pushing to it: a
  # Read & Write token can publish tags but gets 403 on the description, which
  # needs delete/admin scope. The credential here carries that scope.
  description:
    runs-on: ubuntu-latest
    needs: release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # The README's logo is referenced by absolute URL for this reason:
      # relative paths resolve against GitHub and render broken here.
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: danielbodart/portical
          short-description: "Manage UPnP port forwarding rules for Docker containers and systemd units"
          readme-filepath: ./README.md
