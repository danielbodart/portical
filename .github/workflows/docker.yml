name: Build and push image

# Replaces the CircleCI pipeline, which failed silently at checkout for two
# years: its deploy key lost repo access, every build died before the Docker
# step, and the published image stayed frozen at June 2024. Actions checks out
# with a built-in token, so there is no external key to rot.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Credentials only exist on push to master, so PRs build without pushing -
      # a fork or a pull request cannot leak them, and still gets the image
      # verified as buildable.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: danielbodart/portical:latest
