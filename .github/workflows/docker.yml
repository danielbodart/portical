name: Build and push image

# Replaces the CircleCI pipeline, which failed silently at checkout for two
# years: its deploy key lost repo access, every build died before the Docker
# step, and the published image stayed frozen at June 2024. Actions checks out
# with a built-in token, so there is no external key to rot.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise.toml is the one place Bun's version is pinned, for CI and for
      # anyone working on this locally.
      - uses: jdx/mise-action@v2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

  build:
    runs-on: ubuntu-latest
    # Nothing is published unless the tests pass. The old pipeline built and
    # pushed unconditionally, because there were no tests to gate it on.
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Push on any master-branch run that is not a pull request - so both a
      # push and a manual workflow_dispatch publish, while a PR (which may come
      # from a fork) only builds and never sees the credentials.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 matters more than usual here: Portical runs on the home
          # network it is forwarding ports for, which is very often a Pi or an
          # ARM NAS. The CircleCI pipeline only ever built amd64. No QEMU is
          # involved - Bun cross-compiles, so this costs almost nothing.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          tags: danielbodart/portical:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
