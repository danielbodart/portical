name: Build and push image

# Replaces the CircleCI pipeline, which failed silently at checkout for two
# years: its deploy key lost repo access, every build died before the Docker
# step, and the published image stayed frozen at June 2024. Actions checks out
# with a built-in token, so there is no external key to rot.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise.toml is the one place Bun's version is pinned, for CI and for
      # anyone working on this locally.
      - uses: jdx/mise-action@v2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

  build:
    runs-on: ubuntu-latest
    # Nothing is published unless the tests pass. The old pipeline built and
    # pushed unconditionally, because there were no tests to gate it on.
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Push on any master-branch run that is not a pull request - so both a
      # push and a manual workflow_dispatch publish, while a PR (which may come
      # from a fork) only builds and never sees the credentials.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 matters more than usual here: Portical runs on the home
          # network it is forwarding ports for, which is very often a Pi or an
          # ARM NAS. The CircleCI pipeline only ever built amd64. No QEMU is
          # involved - Bun cross-compiles, so this costs almost nothing.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          tags: danielbodart/portical:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Docker Hub has not synced a README from GitHub since Automated Builds went
  # away, so the page at hub.docker.com stayed empty while this repository's
  # README said everything worth knowing. It has to be pushed over the API.
  #
  # Kept in its own job, and allowed to fail, because it is cosmetic: the image
  # is what a release is, and a description that would not update must not make
  # a perfectly good publish look broken. A failure is still visible here.
  #
  # It needs a credential that can edit the repository, which is *not* the same
  # as one that can push to it - pushing works with a Read & Write token, while
  # editing the description is refused with 403 unless the token also carries
  # delete/admin scope. Hence a separate secret, so the push credential can
  # stay as narrow as it is.
  description:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # The README's logo is referenced by absolute URL for this reason:
      # relative paths resolve against GitHub and render broken here.
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_PASSWORD }}
          repository: danielbodart/portical
          short-description: "Manage UPnP port forwarding rules for Docker containers with a single label"
          readme-filepath: ./README.md
